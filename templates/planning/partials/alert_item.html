<li class="alert-item alert-{{ alert.level }}{% if alert.urgent %} is-urgent{% endif %}">
  <span class="alert-icon"><i data-lucide="{{ alert.icon }}" aria-hidden="true"></i></span>
  <div class="alert-body"><strong>{{ alert.title }}</strong><p>{{ alert.message }}</p><span class="alert-level">{{ alert.level_label }}</span></div>
  <a class="text-link" href="{{ alert.url }}">{{ alert.action }}<i data-lucide="arrow-right" aria-hidden="true"></i></a>
</li>
