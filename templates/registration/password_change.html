{% extends 'base.html' %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">SUA CONTA</p><h1>Alterar senha</h1></div></div>
<form class="editor-form password-form" method="post">{% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}{% include 'partials/field.html' %}{% endfor %}
  <div class="form-actions"><a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Cancelar</a><button class="btn btn-primary" type="submit"><i data-lucide="check" aria-hidden="true"></i>Salvar senha</button></div>
</form>
{% endblock %}
